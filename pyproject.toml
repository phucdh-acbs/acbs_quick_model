[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acbs-quick-model"
version = "2.6.7"
description = "Mô hình L1 dự phóng nhanh BCTC (phi tài chính, ngân hàng) - thư viện Python và REST API"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools.packages.find]
include = ["quick_model*", "quick_model_api*"]

[tool.setuptools.package-data]
quick_model = ["config/*/*.json", "config/*/*.csv", "config/*/*/*.json", "config/*/*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
